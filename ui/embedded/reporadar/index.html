<!DOCTYPE html>
<html class="hub-inframe" lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RepoRadar — L'Atelier PC Command</title>
  <link rel="stylesheet" href="vendor/pc-command-kit/tokens/kit.css" />
  <link rel="stylesheet" href="vendor/pc-command-kit/components/embed.css" />
  <link rel="stylesheet" href="vendor/pc-command-kit/components/standalone.css" />
  <link rel="stylesheet" href="vendor/pc-command-kit/components/tool-chrome.css" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      try {
        if (/(?:^|[?&])embed=1(?:&|$)/.test(location.search || "")) {
          document.documentElement.classList.add("pcd-embed");
          document.addEventListener("DOMContentLoaded", function () {
            if (document.body) document.body.classList.add("pcd-embed");
          });
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="app-icon.svg" width="40" height="40" alt="" />
        <div class="brand-text">
          <h1>RepoRadar</h1>
          <p data-i18n="tagline">Tableau Git multi-repo</p>
        </div>
      </div>
      <span class="badge">LOCAL</span>
      <div class="feature-desc">
        <strong data-i18n="featuresTitle">Fonctions</strong>
        <span data-i18n="features">Scan L'Atelier + Dev Central Tree : branche, dirty, ahead/behind, remote.</span>
      </div>
      <p class="privacy-note" data-i18n="privacy">100 % local ? git status uniquement, aucune collecte.</p>
      <p class="copyright" data-i18n="copyright">© 2026 Mr-Aurevo-X · local · CGU dans Atelier</p>
    </aside>
    <div class="main">
      <header class="page-header">
        <h2 data-i18n="title">Repos Git</h2>
        <p id="meta">?</p>
      </header>
      <div class="content">
        <div class="row wrap">
          <label class="field grow"><span data-i18n="rootsLabel">Racines (une par ligne)</span>
            <textarea id="roots" class="out-area" rows="3"></textarea>
          </label>
        </div>
        <div class="row">
          <button type="button" class="btn accent" id="btnScan" data-i18n="btnScan">Scanner</button>
          <input type="search" id="filter" class="inp" data-i18n-placeholder="filterPh" placeholder="Filtrer?" />
          <label class="chk"><input type="checkbox" id="dirtyOnly" /> <span data-i18n="dirtyOnly">Dirty seulement</span></label>
        </div>
        <div class="table-wrap">
          <table class="grid" id="grid">
            <thead>
              <tr>
                <th data-i18n="colName">Nom</th>
                <th data-i18n="colBranch">Branche</th>
                <th data-i18n="colStatus">Statut</th>
                <th data-i18n="colSync">Sync</th>
                <th data-i18n="colLast">Dernier commit</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
      <p class="status" id="status"></p>
    </div>
  </div>
  <script src="suite-boot.js"></script>
    <script src="vendor/pc-command-kit/components/tool-chrome.js"></script>
    <script src="../hub-api-shim.js"></script>
  <script>HubApiShim.install('reporadar');</script>
<script src="app.js"></script>
</body>
</html>
